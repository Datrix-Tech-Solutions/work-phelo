name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check-types

      - name: Lint
        run: npm run lint || true

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: RBAC alignment
        run: npm run check-rbac

      - name: Validate Docker Compose (dev)
        env:
          API_GATEWAY_IMAGE: test
          AUTH_SERVICE_IMAGE: test
          HR_SERVICE_IMAGE: test
          NOTIFICATION_SERVICE_IMAGE: test
          SUBSCRIPTION_SERVICE_IMAGE: test
          MARKETING_SERVICE_IMAGE: test
          NEXTJS_IMAGE: test
        run: |
          docker compose -f infrastructure/docker-compose.dev.yml config >/dev/null
          echo "Docker Compose config validation passed (dev)"

      - name: Validate Docker Compose (prod)
        env:
          API_GATEWAY_IMAGE: test
          AUTH_SERVICE_IMAGE: test
          HR_SERVICE_IMAGE: test
          NOTIFICATION_SERVICE_IMAGE: test
          NEXTJS_IMAGE: test
        run: |
          docker compose -f infrastructure/docker-compose.prod.yml config >/dev/null
          echo "Docker Compose config validation passed (prod)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
