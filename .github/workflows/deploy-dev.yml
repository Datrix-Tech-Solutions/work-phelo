name: Deploy to Dev

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  ORG: datrix-tech-solutions

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check-types

      - name: Build validation
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-gates
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/api-gateway:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/auth-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hr-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/hr-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/hr-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/notification-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push subscription-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/subscription-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/subscription-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push marketing-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/marketing-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/marketing-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 90m
          script: |
            set -e

            DEPLOY_PATH="/var/www/apps/dev.work-phelo.com/work-phelo"
            cd $DEPLOY_PATH

            git fetch origin
            git checkout dev
            git pull origin dev

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u datrix-tech-solutions --password-stdin

            # Pull images via compose (faster/more maintainable than individual pulls).
            docker compose -f infrastructure/docker-compose.dev.yml pull

            # Recreate only what changed and keep persistent volumes intact.
            docker compose -f infrastructure/docker-compose.dev.yml up -d --remove-orphans --no-build

            # Basic health and status check
            docker compose -f infrastructure/docker-compose.dev.yml ps

            # Clean up old images
            docker image prune -f

            echo "Dev deployment complete at $(date)"
