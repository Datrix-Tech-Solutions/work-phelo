name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH_DEV }}"

            # Clone repo if it doesn't exist yet
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone git@github.com:Datrix-Tech-Solutions/work-phelo.git $DEPLOY_PATH
            fi

            cd $DEPLOY_PATH

            # Pull latest dev branch
            git fetch origin
            git checkout dev
            git pull origin dev

            # Install dependencies
            npm install

            # Build all services
            npm run build

            # Restart services via docker compose
            docker compose -f infrastructure/docker-compose.dev.yml down
            docker compose -f infrastructure/docker-compose.dev.yml up -d --build

            echo "Dev deployment complete"
