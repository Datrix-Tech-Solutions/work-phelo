name: Deploy to Dev

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  ORG: datrix-tech-solutions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/api-gateway:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/auth-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hr-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/hr-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/hr-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/notification-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push subscription-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/subscription-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/subscription-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push marketing-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/marketing-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.ORG }}/work-phelo/marketing-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_PATH="/var/www/apps/dev.work-phelo.com/work-phelo"
            cd $DEPLOY_PATH

            git fetch origin
            git checkout dev
            git pull origin dev

            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u datrix-tech-solutions --password-stdin

            # Pull all images
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/api-gateway:dev
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/auth-service:dev
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/hr-service:dev
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/notification-service:dev
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/subscription-service:dev
            docker pull ghcr.io/datrix-tech-solutions/work-phelo/marketing-service:dev

            # Force stop everything first — prevents port conflicts
            docker compose -f infrastructure/docker-compose.dev.yml down --remove-orphans

            # Start fresh
            docker compose -f infrastructure/docker-compose.dev.yml up -d

            # Clean up old images
            docker image prune -f

            echo "Dev deployment complete at $(date)"
