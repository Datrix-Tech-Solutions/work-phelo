name: Deploy to Dev

on:
  push:
    branches: []

env:
  REGISTRY: ghcr.io
  ORG: datrix-tech-solutions
  IMAGE_PREFIX: ghcr.io/datrix-tech-solutions/work-phelo
  COMPOSE_FILE: infrastructure/docker-compose.dev.yml
  DEPLOY_PATH: /var/www/apps/dev.work-phelo.com/work-phelo

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check-types

      - name: Build validation
        run: npm run build

  
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: quality-gates

    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      any_changed: ${{ steps.filter.outputs.any_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            hr-service:
              - 'apps/hr-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            subscription-service:
              - 'apps/subscription-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            marketing-service:
              - 'apps/marketing-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
          list-files: none

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.any_changed == 'true'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - hr-service
          - notification-service
          - subscription-service
          - marketing-service
        exclude: ${{ fromJSON(needs.detect-changes.outputs.changed == '[]' && '[{"service":"__none__"}]' || '[]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service changed
        id: changed
        run: |
          FILTER_KEY="${{ matrix.service }}"
          CHANGED_LIST='${{ needs.detect-changes.outputs.changed }}'
          # changed is a JSON array like ["auth-service","hr-service"]
          if echo "$CHANGED_LIST" | jq -e --arg svc "$FILTER_KEY" 'index($svc) != null' > /dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo " ${{ matrix.service }} unchanged — skipping build"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.changed.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        if: steps.changed.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          # Two immutable tags per image:
          #   :dev        — floating "latest dev" pointer, used by compose
          #   :<sha>      — pinned to this exact commit for rollback
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          # Per-service GHA cache scoped by service name
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Pass build-time args for traceability
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}


  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]

    if: always() && needs.quality-gates.result == 'success'

    environment:
      name: dev
      url: https://dev.work-phelo.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "──────────────────────────────────────"
            echo "  WorkPhelo Dev Deployment"
            echo "  SHA: ${{ github.sha }}"
            echo "  Ref: ${{ github.ref_name }}"
            echo "  Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "──────────────────────────────────────"

            # ── 1. Pull latest code ────────────────────────────────────────
            cd "${{ env.DEPLOY_PATH }}"
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev
            echo " Code updated to $(git rev-parse --short HEAD)"

            # ── 2. Authenticate with GHCR ─────────────────────────────────
            # CR_PAT is a Classic PAT with read:packages scope only.
            # We use --password-stdin to avoid the token appearing in
            # the process list or shell history.
            echo "${{ secrets.CR_PAT }}" \
              | docker login ghcr.io -u datrix-tech-solutions --password-stdin
            echo " Authenticated with GHCR"

            # ── 3. Pull updated images ─────────────────────────────────────
            # compose pull fetches images in parallel, skipping any that
            # are already up-to-date (fast for unchanged services).
            docker compose -f "${{ env.COMPOSE_FILE }}" pull
            echo " Images pulled"

            # ── 4. Rolling restart ─────────────────────────────────────────
            # --remove-orphans cleans up containers for removed services.
            # --no-build ensures we always use the registry image, never
            # a locally built one (avoids stale builds on the server).
            docker compose -f "${{ env.COMPOSE_FILE }}" \
              up -d --remove-orphans --no-build
            echo " Services recreated"

            # ── 5. Health checks ───────────────────────────────────────────
            echo "Waiting 20s for services to initialise..."
            sleep 20

            FAILED_SERVICES=""

            # Check each critical service container is running and healthy.
            # We query the compose-assigned health status; containers without
            # a HEALTHCHECK fall back to 'running' state check only.
            check_service() {
              local service="$1"
              local status
              status=$(docker compose -f "${{ env.COMPOSE_FILE }}" \
                ps --format json "$service" 2>/dev/null \
                | jq -r '.[0].State // .[0].Health // "unknown"' 2>/dev/null \
                || echo "unknown")

              if [[ "$status" == "running" || "$status" == "healthy" ]]; then
                echo "  $service — $status"
              else
                echo "  $service — $status (UNHEALTHY)"
                FAILED_SERVICES="$FAILED_SERVICES $service"
              fi
            }

            echo ""
            echo "── Service Health ────────────────────"
            check_service api-gateway
            check_service auth-service
            check_service hr-service
            check_service notification-service

            # Non-critical: warn but don't fail
            warn_service() {
              local service="$1"
              local status
              status=$(docker compose -f "${{ env.COMPOSE_FILE }}" \
                ps --format json "$service" 2>/dev/null \
                | jq -r '.[0].State // "unknown"' 2>/dev/null \
                || echo "unknown")
              echo "   $service — $status (non-critical)"
            }
            warn_service subscription-service
            warn_service marketing-service

            # ── 6. Full status printout ────────────────────────────────────
            echo ""
            echo "── Container Status ──────────────────"
            docker compose -f "${{ env.COMPOSE_FILE }}" ps

            # ── 7. Clean up dangling images ────────────────────────────────
            docker image prune -f --filter "until=24h"

            # ── 8. Fail if critical services are unhealthy ─────────────────
            if [[ -n "$FAILED_SERVICES" ]]; then
              echo ""
              echo " Deployment failed — unhealthy services:$FAILED_SERVICES"
              echo "Run: docker compose -f ${{ env.COMPOSE_FILE }} logs <service>"
              exit 1
            fi

            echo ""
            echo " Dev deployment complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"