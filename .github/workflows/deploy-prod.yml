name: Deploy to Production

on:
  push:
    branches: [prod]
  workflow_dispatch:

# ── Concurrency ────────────────────────────────────────────────────────────────
# Only one prod deployment runs at a time. Unlike dev, we do NOT cancel in-progress
# — a running prod deploy must finish before the next one starts.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ORG: datrix-tech-solutions
  IMAGE_PREFIX: ghcr.io/datrix-tech-solutions/work-phelo
  COMPOSE_FILE: infrastructure/docker-compose.prod.yml
  DEPLOY_PATH: /var/www/apps/workphelo.datrixtechsolutions.com/work-phelo

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type checks
        run: npm run check-types

      - name: Build validation
        run: npm run build


  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: quality-gates

    outputs:
      changed: ${{ steps.filter.outputs.changes }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      hr-service: ${{ steps.filter.outputs.hr-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      nextjs-web: ${{ steps.filter.outputs.nextjs-web }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            hr-service:
              - 'apps/hr-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'tsconfig*.json'
            nextjs-web:
              - 'apps/web/work-phelo-web/**'
          list-files: none


  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.changed != '[]' && needs.detect-changes.outputs.changed != ''

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - service: hr-service
            dockerfile: apps/hr-service/Dockerfile
          - service: notification-service
            dockerfile: apps/notification-service/Dockerfile
          - service: nextjs-web
            dockerfile: apps/web/work-phelo-web/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service changed
        id: changed
        env:
          SERVICE_CHANGED: ${{ needs.detect-changes.outputs[matrix.service] }}
        run: |
          if [[ "$SERVICE_CHANGED" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚡ ${{ matrix.service }} unchanged — skipping build"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.changed.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        if: steps.changed.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:prod
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-prod
          cache-to: type=gha,scope=${{ matrix.service }}-prod,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}


  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-gates, detect-changes, build-and-push]
    if: |
      always() &&
      needs.quality-gates.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    permissions:
      contents: read
      packages: read

    environment:
      name: prod
      url: https://workphelo.datrixtechsolutions.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Upload the compose file — the server needs nothing else from the repo.
      # Source code is already baked into the images; git is not used on the server.
      - name: Upload Docker Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          source: infrastructure/docker-compose.prod.yml
          target: ${{ env.DEPLOY_PATH }}/
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Shared secrets ─────────────────────────────────────────────────
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          RABBITMQ_URL: ${{ secrets.PROD_RABBITMQ_URL }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          # ── Redis — managed by prod compose ────────────────────────────────
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          # ── Shared variables ───────────────────────────────────────────────
          ALLOWED_ORIGINS: ${{ vars.PROD_ALLOWED_ORIGINS }}
          # ── auth-service ── variables ──────────────────────────────────────
          AUTH_FRONTEND_BASE_URL: ${{ vars.PROD_AUTH_FRONTEND_BASE_URL }}
          AUTH_COOKIE_SECURE: ${{ vars.PROD_AUTH_COOKIE_SECURE }}
          AUTH_COOKIE_SAME_SITE: ${{ vars.PROD_AUTH_COOKIE_SAME_SITE }}
          AUTH_GOOGLE_CLIENT_ID: ${{ vars.PROD_AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CALLBACK_URL: ${{ vars.PROD_AUTH_GOOGLE_CALLBACK_URL }}
          AUTH_MICROSOFT_CLIENT_ID: ${{ vars.PROD_AUTH_MICROSOFT_CLIENT_ID }}
          AUTH_MICROSOFT_CALLBACK_URL: ${{ vars.PROD_AUTH_MICROSOFT_CALLBACK_URL }}
          # ── auth-service ── secrets ────────────────────────────────────────
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_AUTH_GOOGLE_CLIENT_SECRET }}
          AUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.PROD_AUTH_MICROSOFT_CLIENT_SECRET }}
          # ── notification-service ── variables ─────────────────────────────
          NOTIFY_RESEND_FROM_EMAIL: ${{ vars.PROD_NOTIFY_RESEND_FROM_EMAIL }}
          NOTIFY_TERMII_SENDER_ID: ${{ vars.PROD_NOTIFY_TERMII_SENDER_ID }}
          # ── notification-service ── secrets ───────────────────────────────
          NOTIFY_RESEND_API_KEY: ${{ secrets.PROD_NOTIFY_RESEND_API_KEY }}
          NOTIFY_TERMII_API_KEY: ${{ secrets.PROD_NOTIFY_TERMII_API_KEY }}
          # ── seed ──────────────────────────────────────────────────────────
          SUPER_ADMIN_PASSWORD: ${{ secrets.PROD_SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.PROD_SUPER_ADMIN_EMAIL }}
          # ── build metadata ────────────────────────────────────────────────
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          command_timeout: 60m
          script_path: .github/scripts/deploy-prod.sh
          envs: GHCR_TOKEN,DATABASE_URL,RABBITMQ_URL,JWT_SECRET,REDIS_PASSWORD,ALLOWED_ORIGINS,AUTH_FRONTEND_BASE_URL,AUTH_COOKIE_SECURE,AUTH_COOKIE_SAME_SITE,AUTH_GOOGLE_CLIENT_ID,AUTH_GOOGLE_CLIENT_SECRET,AUTH_GOOGLE_CALLBACK_URL,AUTH_MICROSOFT_CLIENT_ID,AUTH_MICROSOFT_CLIENT_SECRET,AUTH_MICROSOFT_CALLBACK_URL,NOTIFY_RESEND_API_KEY,NOTIFY_RESEND_FROM_EMAIL,NOTIFY_TERMII_API_KEY,NOTIFY_TERMII_SENDER_ID,SUPER_ADMIN_PASSWORD,SUPER_ADMIN_EMAIL,BUILD_SHA,BUILD_REF
