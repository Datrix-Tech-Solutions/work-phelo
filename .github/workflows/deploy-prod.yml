name: Deploy to Production

on:
  push:
    branches: []

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check-types

      - name: Build validation
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 90m
          script: |
            set -e

            DEPLOY_PATH="/var/www/apps/work-phelo.com/work-phelo"

            cd $DEPLOY_PATH

            if [ ! -f infrastructure/docker-compose.prod.yml ]; then
              echo "Missing infrastructure/docker-compose.prod.yml on server."
              exit 1
            fi

            git fetch origin
            git checkout prod
            git pull origin prod

            docker compose -f infrastructure/docker-compose.prod.yml down
            docker compose -f infrastructure/docker-compose.prod.yml up -d --build
            docker compose -f infrastructure/docker-compose.prod.yml ps

            echo "Production deployment complete at $(date)"
